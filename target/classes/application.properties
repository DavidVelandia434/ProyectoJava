# Modos disponibles:
# - jdbc    : Obliga a usar Supabase (recomendado para detectar errores de conexión o tablas faltantes).
# - auto    : Intenta conectar a Supabase; si falla, cae a memoria RAM automáticamente.
# - memoria : Trabaja 100% en memoria RAM sin red.
